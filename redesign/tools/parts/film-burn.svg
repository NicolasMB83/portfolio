<svg class="film-burn" viewBox="0 0 960 420" preserveAspectRatio="xMinYMin meet" aria-hidden="true" focusable="false">
  <defs>
    <!-- Static filters, confined to the drawing: rasterised once, never animated -->
    <filter id="burn-melt" filterUnits="userSpaceOnUse" x="-80" y="-80" width="1120" height="580" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="78" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="11"/>
    </filter>
    <filter id="burn-glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1360" height="820">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="burn-core" filterUnits="userSpaceOnUse" x="-80" y="-80" width="1120" height="580" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="G" yChannelSelector="R" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7"/>
    </filter>
  </defs>
  <!-- a diagonal leak, from the left edge up toward the top edge, like the deck's corner -->
  <g filter="url(#burn-glow)" fill="#9a2f0c" opacity="0.55">
    <ellipse cx="90" cy="300" rx="190" ry="110"/>
    <ellipse cx="560" cy="120" rx="170" ry="120"/>
  </g>
  <g filter="url(#burn-melt)" fill="#d9561a" opacity="0.92">
    <ellipse cx="40" cy="318" rx="150" ry="64"/>
    <ellipse cx="200" cy="292" rx="70" ry="38"/>
    <ellipse cx="330" cy="214" rx="80" ry="30"/>
    <ellipse cx="420" cy="190" rx="44" ry="26"/>
    <ellipse cx="575" cy="150" rx="62" ry="78"/>
    <ellipse cx="610" cy="58" rx="56" ry="40"/>
    <ellipse cx="455" cy="96" rx="20" ry="16"/>
  </g>
  <g filter="url(#burn-core)" fill="#ffa64a" opacity="0.9">
    <ellipse cx="34" cy="322" rx="92" ry="34"/>
    <ellipse cx="340" cy="214" rx="44" ry="15"/>
    <ellipse cx="572" cy="160" rx="34" ry="52"/>
    <ellipse cx="612" cy="60" rx="30" ry="20"/>
  </g>
</svg>
